name: GuardScale CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go build -trimpath -ldflags='-s -w' ./cmd/guardscale
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx next typegen && npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - name: Check messaging templates and guarded email activation
        run: |
          node --test devops/cloudformation/messaging.test.cjs
          python3 devops/cloudformation/email-rule-activation.test.py
      - run: npm run build
      - name: Reject secrets and identifiable fixture data
        run: bash scripts/check-public-data.sh
