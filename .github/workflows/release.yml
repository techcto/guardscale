name: Release Guardian.US
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version: {description: Version without leading v, required: true}
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  MP_AWS_ECR: ${{ vars.MP_AWS_ECR }}
  GUARDIAN_CFT_BUCKET: ${{ vars.GUARDIAN_CFT_BUCKET || 'gaurdian-us' }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve release version
        env: {INPUT_VERSION: '${{ github.event.inputs.release_version }}'}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          case "$version" in ''|*[!0-9A-Za-z.-]*) exit 1;; esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ vars.MP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MP_AWS_SECRET_ACCESS_KEY }}
      - run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$MP_AWS_ECR"
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build agent artifacts
        env: {VERSION: '${{ steps.version.outputs.value }}'}
        run: |
          go test ./...
          aws cloudformation validate-template --template-body file://devops/cloudformation/guardian.yaml >/dev/null
          mkdir -p dist/agent
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/agent/guardian-linux-$arch" ./cmd/guardian
          done
          cp configs/config.example.yaml dist/agent/config.example.yaml
          cp systemd/guardian.service dist/agent/guardian.service
          cd dist/agent
          sha256sum guardian-linux-* config.example.yaml guardian.service > SHA256SUMS
      - name: Build and publish service images
        env: {VERSION: '${{ steps.version.outputs.value }}'}
        run: |
          for service in web api worker agent; do
            repository="${{ vars.GUARDIAN_REPOSITORY_PREFIX || 'guardian-us' }}-$service"
            aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$repository" --image-scanning-configuration scanOnPush=true >/dev/null
            image="$MP_AWS_ECR/$repository:$VERSION"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -f "devops/docker/Dockerfile.$service" -t "$image" .
            docker buildx imagetools create -t "$MP_AWS_ECR/$repository:latest" "$image"
          done
      - name: Publish agent and CloudFormation artifacts
        env: {VERSION: '${{ steps.version.outputs.value }}'}
        run: |
          aws s3 cp dist/agent/ "s3://$GUARDIAN_CFT_BUCKET/agent/$VERSION/" --recursive --cache-control "public,max-age=31536000,immutable" --no-progress
          aws s3 cp dist/agent/ "s3://$GUARDIAN_CFT_BUCKET/agent/latest/" --recursive --cache-control no-cache --no-progress
          aws s3 cp devops/cloudformation/guardian.yaml "s3://$GUARDIAN_CFT_BUCKET/cloudformation/guardian-$VERSION.yaml" --content-type text/yaml --cache-control no-cache --no-progress
          aws s3 cp devops/cloudformation/guardian.yaml "s3://$GUARDIAN_CFT_BUCKET/cloudformation/guardian.yaml" --content-type text/yaml --cache-control no-cache --no-progress
