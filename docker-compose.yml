services:
  guardscale-web:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.web
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      GUARDSCALE_API_BASE_URL: http://guardscale-api:3001
      GUARDSCALE_DEPLOYMENT_MODE: ${GUARDSCALE_DEPLOYMENT_MODE:-on-premise}
      GUARDSCALE_ROOT_USER: ${GUARDSCALE_ROOT_USER:-root}
      GUARDSCALE_ROOT_PASSWORD: ${GUARDSCALE_ROOT_PASSWORD:-guardscale-local-change-me}
      GUARDSCALE_SESSION_SECRET: ${GUARDSCALE_SESSION_SECRET:-guardscale-local-session-secret-change-me}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      GUARDSCALE_DYNAMODB_ENDPOINT: http://dynamodb:8000
      GUARDSCALE_TABLE: ${GUARDSCALE_TABLE:-guardscale-local}
      GUARDSCALE_QUEUE_URL: http://queue:9324/queue/guardscale-events
      GUARDSCALE_EVIDENCE_BUCKET: ${GUARDSCALE_EVIDENCE_BUCKET:-guardscale-local-evidence}
      GUARDSCALE_S3_ENDPOINT: http://object-storage:9090
      GUARDSCALE_WHATSAPP_ORIGINATION_ID: ${GUARDSCALE_WHATSAPP_ORIGINATION_ID:-}
      GUARDSCALE_NOTIFICATION_RECIPIENTS: ${GUARDSCALE_NOTIFICATION_RECIPIENTS:-}
      GUARDSCALE_SES_FROM: ${GUARDSCALE_SES_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
    ports:
      - '${GUARDSCALE_WEB_PORT:-80}:3000'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      guardscale-api:
        condition: service_healthy
      dynamodb:
        condition: service_started
      queue:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  guardscale-api:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.api
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3001
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
      GUARDSCALE_ROOT_USER: ${GUARDSCALE_ROOT_USER:-root}
      GUARDSCALE_ROOT_PASSWORD: ${GUARDSCALE_ROOT_PASSWORD:-guardscale-local-change-me}
      GUARDSCALE_SESSION_SECRET: ${GUARDSCALE_SESSION_SECRET:-guardscale-local-session-secret-change-me}
      GUARDSCALE_DYNAMODB_ENDPOINT: http://dynamodb:8000
      GUARDSCALE_TABLE: ${GUARDSCALE_TABLE:-guardscale-local}
      GUARDSCALE_QUEUE_URL: http://queue:9324/queue/guardscale-events
      GUARDSCALE_EVIDENCE_BUCKET: ${GUARDSCALE_EVIDENCE_BUCKET:-guardscale-local-evidence}
      GUARDSCALE_S3_ENDPOINT: http://object-storage:9090
    ports:
      - '${GUARDSCALE_API_PORT:-3001}:3001'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      dynamodb:
        condition: service_started
      queue:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  guardscale-worker:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.worker
    command: ["node", "dist/worker/index.js"]
    environment:
      NODE_ENV: production
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      GUARDSCALE_DYNAMODB_ENDPOINT: http://dynamodb:8000
      GUARDSCALE_TABLE: ${GUARDSCALE_TABLE:-guardscale-local}
      GUARDSCALE_QUEUE_URL: http://queue:9324/queue/guardscale-events
      GUARDSCALE_QUEUE_ENDPOINT: http://queue:9324
      GUARDSCALE_LOCAL_QUEUE_AUTOCREATE: 'true'
      GUARDSCALE_EVIDENCE_BUCKET: ${GUARDSCALE_EVIDENCE_BUCKET:-guardscale-local-evidence}
      GUARDSCALE_S3_ENDPOINT: http://object-storage:9090
      GUARDSCALE_NOTIFICATION_MODE: log
      GUARDSCALE_AI_MODE: mock
      GUARDSCALE_WHATSAPP_ORIGINATION_ID: ${GUARDSCALE_WHATSAPP_ORIGINATION_ID:-}
      GUARDSCALE_NOTIFICATION_RECIPIENTS: ${GUARDSCALE_NOTIFICATION_RECIPIENTS:-}
      GUARDSCALE_SES_FROM: ${GUARDSCALE_SES_FROM:-}
    depends_on:
      guardscale-api:
        condition: service_healthy
      queue:
        condition: service_healthy

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal"]
    volumes:
      - guardscale-dynamodb:/home/dynamodblocal
    ports:
      - '127.0.0.1:${GUARDSCALE_DYNAMODB_PORT:-8000}:8000'

  queue:
    image: softwaremill/elasticmq-native:1.6.15
    ports:
      - '127.0.0.1:${GUARDSCALE_QUEUE_PORT:-9324}:9324'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9325"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${GUARDSCALE_EVIDENCE_BUCKET:-guardscale-local-evidence}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    volumes:
      - guardscale-objects:/tmp/s3mock
    ports:
      - '127.0.0.1:${GUARDSCALE_S3_PORT:-9090}:9090'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  guardscale-dynamodb:
  guardscale-objects:
