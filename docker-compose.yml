services:
  guardian-web:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.web
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      GUARDIAN_API_BASE_URL: http://guardian-api:3001
      GUARDIAN_ROOT_USER: ${GUARDIAN_ROOT_USER:-root}
      GUARDIAN_ROOT_PASSWORD: ${GUARDIAN_ROOT_PASSWORD:-guardian-local-change-me}
      GUARDIAN_SESSION_SECRET: ${GUARDIAN_SESSION_SECRET:-guardian-local-session-secret-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
    ports:
      - '${GUARDIAN_WEB_PORT:-80}:3000'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      guardian-api:
        condition: service_healthy

  guardian-api:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.api
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3001
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      GUARDIAN_API_TOKEN: ${GUARDIAN_API_TOKEN:-local-development-only}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
      GUARDIAN_ROOT_USER: ${GUARDIAN_ROOT_USER:-root}
      GUARDIAN_ROOT_PASSWORD: ${GUARDIAN_ROOT_PASSWORD:-guardian-local-change-me}
      GUARDIAN_SESSION_SECRET: ${GUARDIAN_SESSION_SECRET:-guardian-local-session-secret-change-me}
      GUARDIAN_DYNAMODB_ENDPOINT: http://dynamodb:8000
      GUARDIAN_TABLE: ${GUARDIAN_TABLE:-guardian-local}
      GUARDIAN_QUEUE_URL: http://queue:9324/queue/guardian-events
      GUARDIAN_EVIDENCE_BUCKET: ${GUARDIAN_EVIDENCE_BUCKET:-guardian-local-evidence}
      GUARDIAN_S3_ENDPOINT: http://object-storage:9090
    ports:
      - '${GUARDIAN_API_PORT:-3001}:3001'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      dynamodb:
        condition: service_started
      queue:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  guardian-worker:
    init: true
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.worker
    command: ["node", "dist/worker/index.js"]
    environment:
      NODE_ENV: production
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      GUARDIAN_DYNAMODB_ENDPOINT: http://dynamodb:8000
      GUARDIAN_TABLE: ${GUARDIAN_TABLE:-guardian-local}
      GUARDIAN_QUEUE_URL: http://queue:9324/queue/guardian-events
      GUARDIAN_QUEUE_ENDPOINT: http://queue:9324
      GUARDIAN_LOCAL_QUEUE_AUTOCREATE: 'true'
      GUARDIAN_EVIDENCE_BUCKET: ${GUARDIAN_EVIDENCE_BUCKET:-guardian-local-evidence}
      GUARDIAN_S3_ENDPOINT: http://object-storage:9090
      GUARDIAN_NOTIFICATION_MODE: log
      GUARDIAN_AI_MODE: mock
    depends_on:
      guardian-api:
        condition: service_healthy
      queue:
        condition: service_healthy

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal"]
    volumes:
      - guardian-dynamodb:/home/dynamodblocal
    ports:
      - '127.0.0.1:${GUARDIAN_DYNAMODB_PORT:-8000}:8000'

  queue:
    image: softwaremill/elasticmq-native:1.6.15
    ports:
      - '127.0.0.1:${GUARDIAN_QUEUE_PORT:-9324}:9324'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9325"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${GUARDIAN_EVIDENCE_BUCKET:-guardian-local-evidence}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    volumes:
      - guardian-objects:/tmp/s3mock
    ports:
      - '127.0.0.1:${GUARDIAN_S3_PORT:-9090}:9090'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  guardian-dynamodb:
  guardian-objects:
