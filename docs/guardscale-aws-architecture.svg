<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0078bd"/></marker><style>text{font-family:Arial,sans-serif}.title{font-weight:700;font-size:42px;fill:#fff}.label{font-weight:700;font-size:24px;fill:#07111e}.body{font-size:19px;fill:#456175}.tag{font-size:17px;fill:#0078bd;font-weight:700;letter-spacing:1px}.edge{stroke:#0078bd;stroke-width:3;fill:none;marker-end:url(#arrow)}.note{font-size:16px;fill:#456175}</style></defs><rect width="1800" height="1320" fill="#f1f6fb"/><rect width="1800" height="174" fill="#07111e"/><path fill="#0078bd" d="M76 35l38 15v29c0 24-14 40-38 50-24-10-38-26-38-50V50Z"/><path fill="#07111e" d="M76 51l24 10v18c0 16-9 27-24 35-15-8-24-19-24-35V61Z"/><circle cx="76" cy="77" r="13" fill="#0078bd"/><text x="145" y="78" class="title">GuardScale</text><text x="145" y="119" fill="#8bd5ff" font-family="Arial" font-size="23">Observe → Inspect → Recommend → Approve → Protect → Verify</text><text x="145" y="151" fill="#b7cbdc" font-family="Arial" font-size="17">AWS architecture · bounded agent tools · human-approved response</text><rect x="530" y="214" width="1218" height="786" rx="23" fill="#e5eff7" stroke="#a6c7de" stroke-width="2"/><text x="554" y="249" class="tag">CUSTOMER AWS ACCOUNT / GUARDSCALE CONTROL PLANE</text><rect x="48" y="278" width="398" height="200" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="48" y="294" width="5" height="168" rx="2" fill="#0078bd"/><text x="72" y="308" class="tag">ORIGIN</text><text x="72" y="342" class="label">Monitored Linux origin</text><text x="72" y="374" class="body">Apache / PHP application</text><text x="72" y="401" class="body">Go agent: bounded observations</text><text x="72" y="428" class="body">Local policy + expiring HTTP(S) block</text><rect x="48" y="648" width="398" height="206" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="48" y="664" width="5" height="174" rx="2" fill="#0078bd"/><text x="72" y="678" class="tag">HUMAN CONTROL</text><text x="72" y="712" class="label">Authorized operator</text><text x="72" y="744" class="body">WhatsApp or email alert</text><text x="72" y="771" class="body">Protect / Watch / Dismiss</text><text x="72" y="798" class="body">Authenticated console review</text><rect x="570" y="278" width="510" height="160" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="570" y="294" width="5" height="128" rx="2" fill="#0078bd"/><text x="594" y="308" class="label">HTTPS application entry</text><text x="594" y="340" class="body">Application Load Balancer</text><text x="594" y="367" class="body">Web + API services on ECS Fargate</text><rect x="1170" y="278" width="530" height="160" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="1170" y="294" width="5" height="128" rx="2" fill="#0078bd"/><text x="1194" y="308" class="label">State and evidence</text><text x="1194" y="340" class="body">DynamoDB: scoped records + commands</text><text x="1194" y="367" class="body">S3: bounded evidence objects</text><rect x="570" y="526" width="510" height="168" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="570" y="542" width="5" height="136" rx="2" fill="#0078bd"/><text x="594" y="556" class="label">Durable work and replies</text><text x="594" y="588" class="body">SQS work queue + dead-letter queue</text><text x="594" y="615" class="body">SNS trusted messaging event topics</text><rect x="1170" y="526" width="530" height="168" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="1170" y="542" width="5" height="136" rx="2" fill="#0078bd"/><text x="1194" y="556" class="label">Worker + Amazon Bedrock</text><text x="1194" y="588" class="body">inspect_server → actual tool result</text><text x="1194" y="615" class="body">request_human_approval → recommendation</text><rect x="570" y="790" width="510" height="168" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="570" y="806" width="5" height="136" rx="2" fill="#0078bd"/><text x="594" y="820" class="label">AWS communication channels</text><text x="594" y="852" class="body">End User Messaging Social: WhatsApp</text><text x="594" y="879" class="body">Amazon SES: transactional email</text><rect x="1170" y="790" width="530" height="168" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="1170" y="806" width="5" height="136" rx="2" fill="#0078bd"/><text x="1194" y="820" class="label">Optional SES receiving</text><text x="1194" y="852" class="body">Dedicated MX subdomain + receipt rule</text><text x="1194" y="879" class="body">Signed reply → SNS → SQS → worker</text><path d="M446 332H570" class="edge"/><text x="452" y="315" class="note">HTTPS telemetry</text><path d="M570 400H492V454H446" class="edge"/><text x="273" y="510" class="note">Command polling + outcomes</text><path d="M1080 345H1170" class="edge"/><path d="M825 438V526" class="edge"/><text x="841" y="490" class="note">Queue work</text><path d="M1080 600H1170" class="edge"/><text x="1091" y="582" class="note">Consume</text><path d="M1435 526V438" class="edge"/><text x="1450" y="485" class="note">Read / write</text><path d="M1170 657H1118V748H825V790" class="edge"/><text x="855" y="735" class="note">Send alert / result</text><path d="M570 834H446" class="edge"/><text x="470" y="819" class="note">Deliver</text><path d="M446 694H492V610H570" class="edge"/><text x="304" y="594" class="note">WhatsApp reply</text><path d="M1435 790V730H1088V667H1080" class="edge"/><path d="M446 797H472V1024H1740V875H1700" fill="none" stroke="#0078bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1190" y="1018" class="note">Optional signed email reply route</text><rect x="48" y="1064" width="1700" height="112" rx="15" fill="white" stroke="#b9cfdf" stroke-width="2"/><rect x="48" y="1080" width="5" height="80" rx="2" fill="#0078bd"/><text x="72" y="1094" class="label">Operational foundation</text><text x="72" y="1126" class="body">IAM task roles · Secrets Manager · CloudWatch logs · GitHub Actions · Versioned images and artifacts · Reviewed CloudFormation change sets</text><text x="52" y="1220" class="note">Safety boundary: AI recommends; an authorized human approves. The host revalidates scope and expiry. No arbitrary remote shell.</text><text x="52" y="1250" class="note">Protection outcomes distinguish requested, applied, removed and expired states. Continued traffic permits renewal only within configured limits.</text><text x="52" y="1280" class="note">Source architecture, not deployment certification. Bedrock and messaging require configuration; SES inbound replies require live receiving verification.</text></svg>
