    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
        ],
        "Policies": [
          {
            "Fn::If": [
              "UseStripeCredentials",
              {
                "PolicyName": "stripe-credentials-read",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "secretsmanager:GetSecretValue",
                      "Resource": {
                        "Fn::If": [
                          "UseExternalStripeSecret",
                          {
                            "Ref": "StripeCredentialsSecretArn"
                          },
                          {
                            "Ref": "StripeCredentials"
                          }
                        ]
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "Fn::If": [
              "UseStripeKmsAccess",
              {
                "PolicyName": "stripe-key-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "StripeCredentialsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": {
                            "Fn::If": [
                              "UseExternalStripeSecret",
                              {
                                "Ref": "StripeCredentialsSecretArn"
                              },
                              {
                                "Ref": "StripeCredentials"
                              }
                            ]
                          }
                        }
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          }
        ]
      }
    },
