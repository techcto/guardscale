{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "guardscale AppHub installation using preserved application storage.",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "Description": "Published image tag, e.g. 0.0.4 -- immutable Marketplace repositories never publish a latest tag",
      "AllowedPattern": "[0-9A-Za-z.-]+"
    },
    "CertificateArn": {
      "Type": "String",
      "Default": ""
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "StripeSecretKey": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^(sk|rk)_(live|test)_[a-zA-Z0-9]+$",
      "Description": "Optional initial Stripe secret key. Stored in a retained Secrets Manager secret, never a task definition environment value. Prefer an existing secret ARN for enterprise installs."
    },
    "StripeWebhookSecret": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^whsec_[a-zA-Z0-9]+$",
      "Description": "Stripe webhook signing secret paired with StripeSecretKey. Stored in Secrets Manager."
    },
    "StripeStarterPriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeScalePriceId": {
      "Type": "String",
      "Default": ""
    },
    "ExistingCluster": {
      "Type": "String",
      "Description": "Optional AppHub ECS cluster; empty preserves standalone deployment.",
      "MinLength": 1
    },
    "ExistingListenerArn": {
      "Type": "String",
      "MinLength": 1
    },
    "ExistingAlbSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id",
      "Description": "AppHub ALB security group."
    },
    "AppHostHeader": {
      "Type": "String",
      "Default": "guardscale.org"
    },
    "AppHubApiPriority": {
      "Type": "Number",
      "Default": 200
    },
    "AppHubWebPriority": {
      "Type": "Number",
      "Default": 201
    },
    "ExistingQueue": {
      "Type": "String",
      "Description": "Preserved application resource; managed through CloudFormation import."
    },
    "ExistingDeadLetterQueue": {
      "Type": "String",
      "Description": "Preserved application resource; managed through CloudFormation import."
    },
    "ExistingGuardScaleTable": {
      "Type": "String",
      "Description": "Preserved application resource; managed through CloudFormation import."
    },
    "ExistingEvidenceBucket": {
      "Type": "String",
      "Description": "Preserved application resource; managed through CloudFormation import."
    },
    "ExistingQueueArn": {
      "Type": "String",
      "Description": "Preserved application resource attribute."
    },
    "ExistingDeadLetterQueueArn": {
      "Type": "String",
      "Description": "Preserved application resource attribute."
    },
    "ExistingGuardScaleTableArn": {
      "Type": "String",
      "Description": "Preserved application resource attribute."
    },
    "ExistingEvidenceBucketArn": {
      "Type": "String",
      "Description": "Preserved application resource attribute."
    },
    "GuardianModelId": {
      "Type": "String",
      "Default": "",
      "AllowedValues": [
        "",
        "amazon.nova-lite-v1:0",
        "us.amazon.nova-lite-v1:0"
      ]
    },
    "NotificationMode": {
      "Type": "String",
      "Default": "log",
      "AllowedValues": [
        "log",
        "aws"
      ]
    },
    "WhatsappOriginationId": {
      "Type": "String",
      "Default": ""
    },
    "NotificationRecipients": {
      "Type": "String",
      "Default": ""
    },
    "SesFrom": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappEventTopicArn": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappAlertTemplate": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappBusinessAccountId": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^waba-[a-zA-Z0-9]+$",
      "Description": "Registered WABA ID. With no existing topic ARN, creates and connects a stack-owned SNS topic. Never replaces a different WABA destination."
    },
    "WhatsappTemplateLanguage": {
      "Type": "String",
      "Default": "en_US",
      "AllowedPattern": "[a-z]{2,3}(_[A-Z]{2})?",
      "Description": "Language of the approved WhatsApp alert template."
    },
    "StripeCredentialsSecretArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+$",
      "Description": "Optional existing same-account, same-region Stripe JSON secret ARN. Keys: secret_key and webhook_secret. Leave raw Stripe parameters empty when supplied."
    },
    "StripeCredentialsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key ARN for the Stripe secret. Key policy must permit the task execution role to decrypt."
    },
    "StripeCredentialsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment after rotating Stripe credentials to roll tasks through a reviewed CloudFormation change set."
    },
    "StripeMode": {
      "Type": "String",
      "Default": "live",
      "AllowedValues": [
        "live",
        "sandbox"
      ],
      "Description": "Stripe environment. Use live keys in production and sandbox keys only in isolated test deployments."
    },
    "UsageExport": {
      "Type": "String",
      "Default": "disabled",
      "AllowedValues": [
        "disabled",
        "enabled"
      ],
      "Description": "Enable opted-in measured overage export. Workspace opt-in is still required."
    },
    "StripeServerOveragePriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeLogOveragePriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeAIOveragePriceId": {
      "Type": "String",
      "Default": ""
    },
    "LogMbIncluded": {
      "Type": "String",
      "Default": "",
      "Description": "Optional per-plan MiB allowance JSON; empty uses the application catalog."
    },
    "AICreditWeights": {
      "Type": "String",
      "Default": "",
      "Description": "Versioned model token-to-credit weights. One credit represents $0.001 of inference cost; unconfigured models are never billed."
    },
    "BlockedSignupDomains": {
      "Type": "String",
      "Default": "",
      "Description": "Optional comma-separated signup domain blocklist. Domain and subdomains are blocked for public registration; empty permits all valid email domains."
    },
    "EmailReplyTopicArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$",
      "Description": "Optional existing encrypted SES receiving topic. Leave blank for main-stack-managed receiving or disabled replies."
    },
    "EmailReplyDomain": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^[a-z0-9.-]+\\.[a-z]{2,}$",
      "Description": "Dedicated receiving subdomain configured by this installation or its existing receiving topic."
    },
    "EmailRepliesEnabled": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Create SES reply routing in this application stack using the existing verified sender identity. Does not create another SES identity."
    },
    "EmailReplyHostedZoneId": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^Z[A-Z0-9]+$",
      "Description": "Route 53 hosted zone for the dedicated reply subdomain. Required for managed email replies."
    },
    "EmailReplyExistingRuleSetName": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^[A-Za-z0-9._-]{1,64}$",
      "Description": "Existing active SES rule set to extend. Blank creates a guarded stack-owned rule set only when no other rule set is active."
    },
    "StripeOwnedPairPrefix": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^[a-zA-Z0-9/_-]+$",
      "Description": "Optional main-stack-owned Stripe live/sandbox pair prefix. Blank keeps the existing single-secret/external-secret flow."
    },
    "StripeOwnedPairImport": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "For retained-resource import only. Keep true after import to avoid writing credential values."
    }
  },
  "Conditions": {
    "UseTLS": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CertificateArn"
            },
            ""
          ]
        }
      ]
    },
    "UseAppHub": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "ExistingCluster"
            },
            ""
          ]
        }
      ]
    },
    "UseDedicatedInfrastructure": {
      "Fn::Equals": [
        {
          "Ref": "ExistingCluster"
        },
        ""
      ]
    },
    "DedicatedHttpsListener": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    },
    "DedicatedHttpsApiRule": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    },
    "HasGuardianModel": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "GuardianModelId"
            },
            ""
          ]
        }
      ]
    },
    "HasWhatsappTopic": {
      "Fn::Or": [
        {
          "Condition": "HasExistingWhatsappTopic"
        },
        {
          "Condition": "CreateWhatsappTopic"
        }
      ]
    },
    "HasExistingWhatsappTopic": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "WhatsappEventTopicArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateWhatsappTopic": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "WhatsappBusinessAccountId"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Equals": [
            {
              "Ref": "WhatsappEventTopicArn"
            },
            ""
          ]
        }
      ]
    },
    "UseExternalStripeSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateStripeSecret": {
      "Fn::And": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeCredentials": {
      "Fn::Or": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsSecretArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    },
    "UseStripeKmsAccess": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsKmsKeyArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Or": [
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeCredentialsSecretArn"
                    },
                    ""
                  ]
                }
              ]
            },
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeSecretKey"
                    },
                    ""
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    "HasEmailReplies": {
      "Fn::Or": [
        {
          "Condition": "CreateManagedEmailReplies"
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "EmailReplyTopicArn"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "HasMessagingTopic": {
      "Fn::Or": [
        {
          "Condition": "HasWhatsappTopic"
        },
        {
          "Condition": "HasEmailReplies"
        }
      ]
    },
    "CreateManagedEmailReplies": {
      "Fn::Equals": [
        {
          "Ref": "EmailRepliesEnabled"
        },
        "true"
      ]
    },
    "CreateEmailReplyRuleSet": {
      "Fn::And": [
        {
          "Condition": "CreateManagedEmailReplies"
        },
        {
          "Fn::Equals": [
            {
              "Ref": "EmailReplyExistingRuleSetName"
            },
            ""
          ]
        }
      ]
    },
    "HasStripeOwnedPair": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeOwnedPairPrefix"
            },
            ""
          ]
        }
      ]
    },
    "InitializeStripeOwnedPair": {
      "Fn::Equals": [
        {
          "Ref": "StripeOwnedPairImport"
        },
        "false"
      ]
    }
  },
  "Rules": {
    "StripeCredentialSource": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeSecretKey"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeWebhookSecret"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeCredentialsSecretArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeSecretKey"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeWebhookSecret"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Supply both raw Stripe credentials or an existing secret ARN, never partial credentials or both sources."
        }
      ]
    },
    "EmailReplyConfiguration": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailRepliesEnabled"
                      },
                      "false"
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailReplyTopicArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailReplyDomain"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailRepliesEnabled"
                      },
                      "false"
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "EmailReplyTopicArn"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "EmailReplyDomain"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailRepliesEnabled"
                      },
                      "true"
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "EmailReplyTopicArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "EmailReplyDomain"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "EmailReplyHostedZoneId"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "SesFrom"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Managed replies require a dedicated domain, hosted zone and verified SES From address with no external topic. Otherwise configure both external topic/domain, or leave replies disabled."
        }
      ]
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterName": {
          "Fn::Sub": "guardscale-${AWS::StackName}"
        },
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale public ingress",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale services from ALB",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Fn::If": [
                "UseAppHub",
                {
                  "Ref": "ExistingAlbSecurityGroup"
                },
                {
                  "Ref": "ALBSG"
                }
              ]
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "ALBSG"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "Listener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "WebTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "Listener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "ApiTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Condition": "DedicatedHttpsListener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "HttpsApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Condition": "DedicatedHttpsApiRule",
      "Properties": {
        "ListenerArn": {
