    "WhatsappRoutingRole": {
      "Type": "AWS::IAM::Role",
      "Condition": "CreateWhatsappTopic",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "guardscale-waba-routing",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "social-messaging:GetLinkedWhatsAppBusinessAccount",
                    "social-messaging:PutWhatsAppBusinessAccountEventDestinations"
                  ],
                  "Resource": {
                    "Fn::Sub": [
                      "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:waba/${WabaKey}",
                      {
                        "WabaKey": {
                          "Fn::Select": [
                            1,
                            {
                              "Fn::Split": [
                                "waba-",
                                {
                                  "Ref": "WhatsappBusinessAccountId"
                                }
                              ]
                            }
                          ]
                        }
                      }
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "social-messaging:GetLinkedWhatsAppBusinessAccountPhoneNumber",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:social-messaging:${AWS::Region}:${AWS::AccountId}:phone-number-id/*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "WhatsappRoutingFunction": {
      "Type": "AWS::Lambda::Function",
      "Condition": "CreateWhatsappTopic",
      "Properties": {
        "Runtime": "python3.13",
        "Handler": "index.handler",
        "Role": {
          "Fn::GetAtt": [
            "WhatsappRoutingRole",
            "Arn"
          ]
        },
        "Timeout": 90,
        "Code": {
          "ZipFile": "\"\"\"CloudFormation-only WABA routing lifecycle. Never called by the application.\"\"\"\nimport json\nimport urllib.request\n\n\ndef reconcile(event, client):\n    props = event['ResourceProperties']\n    waba, topic = props['WabaId'], props['TopicArn']\n    try:\n        account = client.get_linked_whatsapp_business_account(id=waba)['account']\n    except Exception as error:\n        if event['RequestType'] == 'Delete' and getattr(error, 'response', {}).get('Error', {}).get('Code') == 'ResourceNotFoundException':\n            return  # Registration was already removed; no route remains to detach.\n        raise\n    destinations = account.get('eventDestinations', [])\n    if event['RequestType'] == 'Delete':\n        # Only detach the exact stack-owned topic; never touch a replacement destination.\n        if destinations and all(d['eventDestinationArn'] == topic for d in destinations):\n            client.put_whatsapp_business_account_event_destinations(id=waba, eventDestinations=[])\n        return\n    if event['RequestType'] == 'Update':\n        old = event['OldResourceProperties']\n        changed = (old['WabaId'], old['TopicArn']) != (waba, topic)\n        # A failed migration's reverse rollback is a no-op when the original route remains.\n        if changed and not (destinations and all(d['eventDestinationArn'] == topic for d in destinations)):\n            raise ValueError('WABA/topic changes require a separate reviewed routing migration.')\n    phone = client.get_linked_whatsapp_business_account_phone_number(id=props['SenderId'])\n    if phone.get('linkedWhatsAppBusinessAccountId') not in (waba, account.get('id'), account.get('arn')):\n        raise ValueError('The launch sender does not belong to this WABA.')\n    if account.get('registrationStatus') != 'COMPLETE':\n        raise ValueError('Complete WhatsApp business registration before launch.')\n    if any(d['eventDestinationArn'] != topic for d in destinations):\n        raise ValueError('WABA already routes elsewhere. Preserve its existing topic or explicitly migrate it first.')\n    if not destinations:\n        client.put_whatsapp_business_account_event_destinations(\n            id=waba, eventDestinations=[{'eventDestinationArn': topic}])\n\n\ndef handler(event, context):\n    import boto3\n    from botocore.config import Config\n    status, reason = 'SUCCESS', 'WABA routing reconciled.'\n    try:\n        reconcile(event, boto3.client('socialmessaging', config=Config(\n            connect_timeout=5, read_timeout=10, retries={'max_attempts': 2})))\n    except Exception as error:\n        status = 'FAILED'\n        # Never log the event, presigned response URL, provider body or phone details.\n        reason = str(error) if isinstance(error, ValueError) else 'AWS routing operation failed: ' + type(error).__name__\n    body = json.dumps({'Status': status, 'Reason': reason,\n        'PhysicalResourceId': event.get('PhysicalResourceId') or event['StackId'] + '/' + event['LogicalResourceId'],\n        'StackId': event['StackId'], 'RequestId': event['RequestId'],\n        'LogicalResourceId': event['LogicalResourceId'], 'NoEcho': True, 'Data': {}}).encode()\n    request = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',\n        headers={'content-type': '', 'content-length': str(len(body))})\n    try:\n        with urllib.request.urlopen(request, timeout=10):\n            pass\n    except Exception:\n        raise RuntimeError('Unable to deliver CloudFormation response; retry required.') from None\n"
        }
      }
    },
