        "Handler": "index.handler",
        "Role": {
          "Fn::GetAtt": [
            "EmailReplyActivationRole",
            "Arn"
          ]
        },
        "Timeout": 90,
        "LoggingConfig": {
          "LogGroup": {
            "Ref": "LogGroup"
          },
          "LogFormat": "JSON"
        },
        "Code": {
          "ZipFile": "import json\nimport urllib.request\nimport boto3\n\ndef handler(event, context):\n    props = event['ResourceProperties']\n    name = props['RuleSetName']\n    client = boto3.client('ses')\n    status, reason = 'SUCCESS', 'GuardScale email receiving activation checked'\n    try:\n        active = client.describe_active_receipt_rule_set().get('Metadata', {}).get('Name')\n        if event['RequestType'] == 'Delete':\n            if active == name:\n                client.set_active_receipt_rule_set()\n        else:\n            if active and active != name:\n                raise ValueError('A different SES receipt rule set is active; refusing to replace it. Use ExistingRuleSetName instead.')\n            client.set_active_receipt_rule_set(RuleSetName=name)\n    except Exception as error:\n        status, reason = 'FAILED', str(error)[:500]\n    body = json.dumps({'Status': status, 'Reason': reason,\n        'PhysicalResourceId': event.get('PhysicalResourceId', 'guardscale-email-activation-'+name),\n        'StackId': event['StackId'], 'RequestId': event['RequestId'],\n        'LogicalResourceId': event['LogicalResourceId'], 'Data': {}}).encode()\n    request = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',\n        headers={'content-type': '', 'content-length': str(len(body))})\n    with urllib.request.urlopen(request, timeout=20):\n        pass\n"
        }
      }
    },
    "ActivateEmailReplyRules": {
      "Type": "Custom::GuardScaleEmailRuleActivation",
      "Condition": "CreateEmailReplyRuleSet",
      "DependsOn": "EmailReplyRule",
      "Properties": {
        "ServiceToken": {
          "Fn::GetAtt": [
            "EmailReplyActivationFunction",
            "Arn"
          ]
        },
        "ServiceTimeout": 120,
        "RuleSetName": {
          "Fn::If": [
            "CreateEmailReplyRuleSet",
            {
              "Ref": "EmailReplyRuleSet"
            },
            {
              "Ref": "EmailReplyExistingRuleSetName"
            }
          ]
        }
      }
    },
    "LiveCredentials": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "HasStripeOwnedPair",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Name": {
          "Fn::Sub": "${StripeOwnedPairPrefix}/live"
        },
        "Description": "GuardScale live Stripe credentials. Populate both fields before enabling billing.",
        "SecretString": {
          "Fn::If": [
            "InitializeStripeOwnedPair",
            "{\"secret_key\":\"\",\"webhook_secret\":\"\"}",
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "Tags": [
          {
            "Key": "Application",
            "Value": "guardscale"
          },
          {
            "Key": "BillingEnvironment",
            "Value": "live"
          }
        ]
      }
    },
    "SandboxCredentials": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "HasStripeOwnedPair",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Name": {
          "Fn::Sub": "${StripeOwnedPairPrefix}/sandbox"
        },
        "Description": "GuardScale Stripe sandbox credentials. Never use live keys here.",
        "SecretString": {
          "Fn::If": [
            "InitializeStripeOwnedPair",
            "{\"secret_key\":\"\",\"webhook_secret\":\"\"}",
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "Tags": [
          {
            "Key": "Application",
            "Value": "guardscale"
          },
          {
            "Key": "BillingEnvironment",
            "Value": "sandbox"
          }
        ]
      }
    }
  },
