{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "GuardScale control plane - ECS Fargate, ALB, SQS, DynamoDB, S3, and CloudWatch",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "Description": "Published image tag, e.g. 0.0.4 -- immutable Marketplace repositories never publish a latest tag",
      "AllowedPattern": "[0-9A-Za-z.-]+"
    },
    "CertificateArn": {
      "Type": "String",
      "Default": ""
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "ExistingCluster": {
      "Type": "String",
      "Description": "Optional AppHub ECS cluster; empty preserves standalone deployment.",
      "MinLength": 1
    },
    "ExistingListenerArn": {
      "Type": "String",
      "MinLength": 1
    },
    "ExistingAlbSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id",
      "Description": "AppHub ALB security group."
    },
    "AppHostHeader": {
      "Type": "String",
      "Default": "guardscale.org"
    },
    "AppHubApiPriority": {
      "Type": "Number",
      "Default": 200
    },
    "AppHubWebPriority": {
      "Type": "Number",
      "Default": 201
    }
  },
  "Conditions": {
    "UseTLS": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CertificateArn"
            },
            ""
          ]
        }
      ]
    },
    "UseAppHub": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "ExistingCluster"
            },
            ""
          ]
        }
      ]
    },
    "UseDedicatedInfrastructure": {
      "Fn::Equals": [
        {
          "Ref": "ExistingCluster"
        },
        ""
      ]
    },
    "DedicatedHttpsListener": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    },
    "DedicatedHttpsApiRule": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterName": {
          "Fn::Sub": "guardscale-${AWS::StackName}"
        },
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale public ingress",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale services from ALB",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Fn::If": [
                "UseAppHub",
                {
                  "Ref": "ExistingAlbSecurityGroup"
                },
                {
                  "Ref": "ALBSG"
                }
              ]
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "ALBSG"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "Listener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "WebTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "Listener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "ApiTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Condition": "DedicatedHttpsListener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "HttpsApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Condition": "DedicatedHttpsApiRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "HttpsListener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "ApiTarget"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "Queue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 120,
        "MessageRetentionPeriod": 345600,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetterQueue",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "DeadLetterQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600
      }
    },
    "GuardScaleTable": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1sk",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "gsi1pk",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "gsi1sk",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "ttl",
          "Enabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      }
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "guardscale-data",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:Query",
                    "dynamodb:UpdateItem"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "GuardScaleTable",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::Sub": "${GuardScaleTable.Arn}/index/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "sqs:SendMessage",
                    "sqs:ReceiveMessage",
                    "sqs:DeleteMessage",
                    "sqs:GetQueueAttributes"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "Queue",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${EvidenceBucket.Arn}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ses:SendEmail",
                    "social-messaging:SendWhatsAppMessage"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ]
      }
    },
    "WebTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "web",
            "Image": {
              "Fn::Sub": "${ImageBase}-web:${ReleaseVersion}"
            },
            "PortMappings": [
              {
                "ContainerPort": 3000
              }
            ],
            "Environment": [
              {
                "Name": "GUARDSCALE_TABLE",
                "Value": {
                  "Ref": "GuardScaleTable"
                }
              },
              {
                "Name": "GUARDSCALE_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "GUARDSCALE_ROOT_PASSWORD",
                "Value": {
                  "Ref": "RootPassword"
                }
              },
              {
                "Name": "GUARDSCALE_SESSION_SECRET",
                "Value": {
                  "Ref": "SessionSecret"
                }
              },
              {
                "Name": "GUARDSCALE_DEPLOYMENT_MODE",
                "Value": {
                  "Ref": "DeploymentMode"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "LogGroup"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "web"
              }
            }
          }
        ]
      }
    },
    "ApiTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "api",
            "Image": {
              "Fn::Sub": "${ImageBase}-api:${ReleaseVersion}"
            },
            "PortMappings": [
              {
                "ContainerPort": 3001
              }
            ],
            "Environment": [
              {
                "Name": "GUARDSCALE_TABLE",
                "Value": {
                  "Ref": "GuardScaleTable"
                }
              },
              {
                "Name": "GUARDSCALE_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              },
              {
                "Name": "GUARDSCALE_EVIDENCE_BUCKET",
                "Value": {
                  "Ref": "EvidenceBucket"
                }
              },
              {
                "Name": "GUARDSCALE_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "GUARDSCALE_ROOT_PASSWORD",
                "Value": {
                  "Ref": "RootPassword"
                }
              },
              {
                "Name": "GUARDSCALE_SESSION_SECRET",
                "Value": {
                  "Ref": "SessionSecret"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "LogGroup"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "api"
              }
            }
          }
        ]
      }
    },
    "WorkerTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "worker",
            "Image": {
              "Fn::Sub": "${ImageBase}-worker:${ReleaseVersion}"
            },
            "Environment": [
              {
                "Name": "GUARDSCALE_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "LogGroup"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "worker"
              }
            }
          }
        ]
      }
    },
    "WebService": {
      "Type": "AWS::ECS::Service",
      "DependsOn": [
        "AppHubApiRule",
        "AppHubWebRule"
      ],
      "Properties": {
        "Cluster": {
          "Fn::If": [
            "UseAppHub",
            {
              "Ref": "ExistingCluster"
            },
            {
              "Ref": "Cluster"
            }
          ]
        },
        "LaunchType": "FARGATE",
        "DesiredCount": 1,
        "TaskDefinition": {
          "Ref": "WebTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        },
        "LoadBalancers": [
          {
            "ContainerName": "web",
            "ContainerPort": 3000,
            "TargetGroupArn": {
              "Fn::If": [
                "UseAppHub",
                {
                  "Ref": "AppHubWebTarget"
                },
                {
                  "Ref": "WebTarget"
                }
              ]
            }
          }
        ]
      }
    },
    "ApiService": {
      "Type": "AWS::ECS::Service",
      "DependsOn": [
        "AppHubApiRule",
        "AppHubWebRule"
      ],
      "Properties": {
        "Cluster": {
          "Fn::If": [
            "UseAppHub",
            {
              "Ref": "ExistingCluster"
            },
            {
              "Ref": "Cluster"
            }
          ]
        },
        "LaunchType": "FARGATE",
        "DesiredCount": 1,
        "TaskDefinition": {
          "Ref": "ApiTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        },
        "LoadBalancers": [
          {
            "ContainerName": "api",
            "ContainerPort": 3001,
            "TargetGroupArn": {
              "Fn::If": [
                "UseAppHub",
                {
                  "Ref": "AppHubApiTarget"
                },
                {
                  "Ref": "ApiTarget"
                }
              ]
            }
          }
        ]
      }
    },
    "WorkerService": {
      "Type": "AWS::ECS::Service",
      "Properties": {
        "Cluster": {
          "Fn::If": [
            "UseAppHub",
            {
              "Ref": "ExistingCluster"
            },
            {
              "Ref": "Cluster"
            }
          ]
        },
        "LaunchType": "FARGATE",
        "DesiredCount": 1,
        "TaskDefinition": {
          "Ref": "WorkerTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        }
      }
    },
    "AppHubWebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "AppHubApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "AppHubApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "ExistingListenerArn"
        },
        "Priority": {
          "Ref": "AppHubApiPriority"
        },
        "Conditions": [
          {
            "Field": "host-header",
            "HostHeaderConfig": {
              "Values": [
                {
                  "Ref": "AppHostHeader"
                }
              ]
            }
          },
          {
            "Field": "path-pattern",
            "PathPatternConfig": {
              "Values": [
                "/api/*"
              ]
            }
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "AppHubApiTarget"
            }
          }
        ]
      }
    },
    "AppHubWebRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "ExistingListenerArn"
        },
        "Priority": {
          "Ref": "AppHubWebPriority"
        },
        "Conditions": [
          {
            "Field": "host-header",
            "HostHeaderConfig": {
              "Values": [
                {
                  "Ref": "AppHostHeader"
                }
              ]
            }
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "AppHubWebTarget"
            }
          }
        ]
      }
    },
    "AppHubCertificate": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerCertificate",
      "Properties": {
        "ListenerArn": {
          "Ref": "ExistingListenerArn"
        },
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ]
      }
    }
  },
  "Outputs": {
    "URL": {
      "Value": {
        "Fn::If": [
          "UseAppHub",
          {
            "Fn::Sub": "https://${AppHostHeader}"
          },
          {
            "Fn::If": [
              "UseTLS",
              {
                "Fn::Sub": "https://${ALB.DNSName}"
              },
              {
                "Fn::Sub": "http://${ALB.DNSName}"
              }
            ]
          }
        ]
      }
    },
    "RootUsername": {
      "Value": {
        "Ref": "RootUsername"
      }
    }
  }
}
