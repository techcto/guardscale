{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "GuardScale control plane - ECS Fargate, ALB, SQS, DynamoDB, S3, and CloudWatch",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "Description": "Published image tag, e.g. 0.0.4 -- immutable Marketplace repositories never publish a latest tag",
      "AllowedPattern": "[0-9A-Za-z.-]+"
    },
    "CertificateArn": {
      "Type": "String",
      "Default": ""
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "StripeSecretKey": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^(sk|rk)_(live|test)_[a-zA-Z0-9]+$",
      "Description": "Optional initial Stripe secret key. Stored in a retained Secrets Manager secret, never a task definition environment value. Prefer an existing secret ARN for enterprise installs."
    },
    "StripeWebhookSecret": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^whsec_[a-zA-Z0-9]+$",
      "Description": "Stripe webhook signing secret paired with StripeSecretKey. Stored in Secrets Manager."
    },
    "StripeStarterPriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeScalePriceId": {
      "Type": "String",
      "Default": ""
    },
    "ExistingCluster": {
      "Type": "String",
      "Description": "Optional AppHub ECS cluster; empty preserves standalone deployment.",
      "MinLength": 1
    },
    "ExistingListenerArn": {
      "Type": "String",
      "MinLength": 1
    },
    "ExistingAlbSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id",
      "Description": "AppHub ALB security group."
    },
    "AppHostHeader": {
      "Type": "String",
      "Default": "guardscale.org"
    },
    "AppHubApiPriority": {
      "Type": "Number",
      "Default": 200
    },
    "AppHubWebPriority": {
      "Type": "Number",
      "Default": 201
    },
    "GuardianModelId": {
      "Type": "String",
      "Default": "",
      "AllowedValues": [
        "",
        "amazon.nova-lite-v1:0",
        "us.amazon.nova-lite-v1:0"
      ]
    },
    "NotificationMode": {
      "Type": "String",
      "Default": "log",
      "AllowedValues": [
        "log",
        "aws"
      ]
    },
    "WhatsappOriginationId": {
      "Type": "String",
      "Default": ""
    },
    "NotificationRecipients": {
      "Type": "String",
      "Default": ""
    },
    "SesFrom": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappEventTopicArn": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappAlertTemplate": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappBusinessAccountId": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^waba-[a-zA-Z0-9]+$",
      "Description": "Registered WABA ID. With no existing topic ARN, creates and connects a stack-owned SNS topic. Never replaces a different WABA destination."
    },
    "WhatsappTemplateLanguage": {
      "Type": "String",
      "Default": "en_US",
      "AllowedPattern": "[a-z]{2,3}(_[A-Z]{2})?",
      "Description": "Language of the approved WhatsApp alert template."
    },
    "StripeCredentialsSecretArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+$",
      "Description": "Optional existing same-account, same-region Stripe JSON secret ARN. Keys: secret_key and webhook_secret. Leave raw Stripe parameters empty when supplied."
    },
    "StripeCredentialsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key ARN for the Stripe secret. Key policy must permit the task execution role to decrypt."
    },
    "StripeCredentialsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment after rotating Stripe credentials to roll tasks through a reviewed CloudFormation change set."
    },
    "StripeMode": {
      "Type": "String",
      "Default": "live",
      "AllowedValues": [
        "live",
        "sandbox"
      ],
      "Description": "Stripe environment. Use live keys in production and sandbox keys only in isolated test deployments."
    }
  },
  "Conditions": {
    "UseTLS": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CertificateArn"
            },
            ""
          ]
        }
      ]
    },
    "UseAppHub": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "ExistingCluster"
            },
            ""
          ]
        }
      ]
    },
    "UseDedicatedInfrastructure": {
      "Fn::Equals": [
        {
          "Ref": "ExistingCluster"
        },
        ""
      ]
    },
    "DedicatedHttpsListener": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    },
    "DedicatedHttpsApiRule": {
      "Fn::And": [
        {
          "Condition": "UseDedicatedInfrastructure"
        },
        {
          "Condition": "UseTLS"
        }
      ]
    },
    "HasGuardianModel": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "GuardianModelId"
            },
            ""
          ]
        }
      ]
    },
    "HasWhatsappTopic": {
      "Fn::Or": [
        {
          "Condition": "HasExistingWhatsappTopic"
        },
        {
          "Condition": "CreateWhatsappTopic"
        }
      ]
    },
    "HasExistingWhatsappTopic": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "WhatsappEventTopicArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateWhatsappTopic": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "WhatsappBusinessAccountId"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Equals": [
            {
              "Ref": "WhatsappEventTopicArn"
            },
            ""
          ]
        }
      ]
    },
    "UseExternalStripeSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateStripeSecret": {
      "Fn::And": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeCredentials": {
      "Fn::Or": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsSecretArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    },
    "UseStripeKmsAccess": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsKmsKeyArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Or": [
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeCredentialsSecretArn"
                    },
                    ""
                  ]
                }
              ]
            },
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeSecretKey"
                    },
                    ""
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  },
  "Rules": {
    "StripeCredentialSource": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeSecretKey"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeWebhookSecret"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeCredentialsSecretArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeSecretKey"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeWebhookSecret"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Supply both raw Stripe credentials or an existing secret ARN, never partial credentials or both sources."
        }
      ]
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterName": {
          "Fn::Sub": "guardscale-${AWS::StackName}"
        },
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale public ingress",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "GuardScale services from ALB",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Fn::If": [
                "UseAppHub",
                {
                  "Ref": "ExistingAlbSecurityGroup"
                },
                {
                  "Ref": "ALBSG"
                }
              ]
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "ALBSG"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "Listener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "WebTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "ApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "Listener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "ApiTarget"
                }
              }
            ]
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Condition": "UseDedicatedInfrastructure"
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Condition": "DedicatedHttpsListener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "HttpsApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Condition": "DedicatedHttpsApiRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "HttpsListener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*"
            ]
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "ApiTarget"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "Queue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 120,
        "MessageRetentionPeriod": 345600,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetterQueue",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "DeadLetterQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600
      }
    },
    "GuardScaleTable": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1sk",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "gsi1pk",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "gsi1sk",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "ttl",
          "Enabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      }
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
        ],
        "Policies": [
          {
            "Fn::If": [
              "UseStripeCredentials",
              {
                "PolicyName": "stripe-credentials-read",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "secretsmanager:GetSecretValue",
                      "Resource": {
                        "Fn::If": [
                          "UseExternalStripeSecret",
                          {
                            "Ref": "StripeCredentialsSecretArn"
                          },
                          {
                            "Ref": "StripeCredentials"
                          }
                        ]
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "Fn::If": [
              "UseStripeKmsAccess",
              {
                "PolicyName": "stripe-key-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "StripeCredentialsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": {
                            "Fn::If": [
                              "UseExternalStripeSecret",
                              {
                                "Ref": "StripeCredentialsSecretArn"
                              },
                              {
                                "Ref": "StripeCredentials"
                              }
                            ]
                          }
                        }
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          }
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "guardscale-data",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:Query",
                    "dynamodb:UpdateItem"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "GuardScaleTable",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::Sub": "${GuardScaleTable.Arn}/index/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "sqs:SendMessage",
                    "sqs:ReceiveMessage",
                    "sqs:DeleteMessage",
                    "sqs:GetQueueAttributes"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "Queue",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${EvidenceBucket.Arn}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ses:SendEmail",
                    "social-messaging:SendWhatsAppMessage",
                    "social-messaging:ListLinkedWhatsAppBusinessAccounts",
                    "social-messaging:GetLinkedWhatsAppBusinessAccount",
                    "social-messaging:GetLinkedWhatsAppBusinessAccountPhoneNumber",
                    "social-messaging:ListWhatsAppMessageTemplates"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ]
      }
    },
    "WebTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
