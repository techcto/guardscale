AWSTemplateFormatVersion: '2010-09-09'
Description: GuardScale control plane - ECS Fargate, ALB, SQS, DynamoDB, S3, and CloudWatch
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  PublicSubnets: {Type: 'List<AWS::EC2::Subnet::Id>'}
  PrivateSubnets: {Type: 'List<AWS::EC2::Subnet::Id>'}
  ImageBase: {Type: String, Description: ECR registry/repository prefix without service suffix}
  ReleaseVersion: {Type: String, Description: 'Published image tag, e.g. 0.0.4 -- immutable Marketplace repositories never publish a latest tag', AllowedPattern: '[0-9A-Za-z.-]+'}
  CertificateArn: {Type: String, Default: ''}
  RootUsername: {Type: String, Default: root, MinLength: 3}
  RootPassword: {Type: String, NoEcho: true, MinLength: 12}
  SessionSecret: {Type: String, NoEcho: true, MinLength: 32}
  DeploymentMode: {Type: String, Default: on-premise, AllowedValues: ['on-premise', 'saas']}
  StripeSecretKey: {Type: String, Default: '', NoEcho: true}
  StripeWebhookSecret: {Type: String, Default: '', NoEcho: true}
  StripeStarterPriceId: {Type: String, Default: ''}
  StripeScalePriceId: {Type: String, Default: ''}
  UsageExport: {Type: String, Default: disabled, AllowedValues: [disabled, enabled], Description: 'Enable opted-in overage and Stripe meter export (saas only). Disabled keeps hard plan limits.'}
  StripeServerOveragePriceId: {Type: String, Default: '', Description: 'Metered price on guardscale_server_hours_v1 (setup-plans.mjs).'}
  StripeLogOveragePriceId: {Type: String, Default: '', Description: 'Metered price on guardscale_log_mb_v1.'}
  StripeAIOveragePriceId: {Type: String, Default: '', Description: 'Metered price on guardscale_ai_credits_v1.'}
  LogMbIncluded: {Type: String, Default: '', Description: 'JSON of log MB included per plan. Empty leaves logs unmetered.'}
  AICreditWeights: {Type: String, Default: '', Description: 'Versioned AI credit weights JSON with included_credits per plan. Empty leaves AI unpriced.'}
  GuardianModelId: {Type: String, Default: '', AllowedValues: ['', 'amazon.nova-lite-v1:0', 'us.amazon.nova-lite-v1:0']}
  NotificationMode: {Type: String, Default: log, AllowedValues: [log, aws]}
  WhatsappOriginationId: {Type: String, Default: ''}
  NotificationRecipients: {Type: String, Default: ''}
  SesFrom: {Type: String, Default: ''}
  PublicUrl: {Type: String, Default: ''}
  WhatsappEventTopicArn: {Type: String, Default: ''}
  WhatsappAlertTemplate: {Type: String, Default: ''}
  WhatsappBusinessAccountId: {"Type":"String","Default":"","AllowedPattern":"^$|^waba-[a-zA-Z0-9]+$","Description":"Registered WABA ID. With no existing topic ARN, creates and connects a stack-owned SNS topic. Never replaces a different WABA destination."}
  WhatsappTemplateLanguage: {"Type":"String","Default":"en_US","AllowedPattern":"[a-z]{2,3}(_[A-Z]{2})?","Description":"Language of the approved WhatsApp alert template."}
Conditions:
  UseTLS: {"Fn::Not":[{"Fn::Equals":[{"Ref":"CertificateArn"},""]}]}
  HasGuardianModel: {"Fn::Not":[{"Fn::Equals":[{"Ref":"GuardianModelId"},""]}]}
  HasWhatsappTopic: {"Fn::Or":[{"Condition":"HasExistingWhatsappTopic"},{"Condition":"CreateWhatsappTopic"}]}
  HasExistingWhatsappTopic: {"Fn::Not":[{"Fn::Equals":[{"Ref":"WhatsappEventTopicArn"},""]}]}
  CreateWhatsappTopic: {"Fn::And":[{"Fn::Not":[{"Fn::Equals":[{"Ref":"WhatsappBusinessAccountId"},""]}]},{"Fn::Equals":[{"Ref":"WhatsappEventTopicArn"},""]}]}
Resources:
  GuardianModelPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGuardianModel
    Properties:
      PolicyName: guardscale-guardian-inference
      Roles: [{Ref: TaskRole}]
      PolicyDocument:
