AWSTemplateFormatVersion: '2010-09-09'
Description: GuardScale control plane - ECS Fargate, ALB, SQS, DynamoDB, S3, and CloudWatch
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  PublicSubnets: {Type: 'List<AWS::EC2::Subnet::Id>'}
  PrivateSubnets: {Type: 'List<AWS::EC2::Subnet::Id>'}
  ImageBase: {Type: String, Description: ECR registry/repository prefix without service suffix}
  ReleaseVersion: {Type: String, Description: 'Published image tag, e.g. 0.0.4 -- immutable Marketplace repositories never publish a latest tag', AllowedPattern: '[0-9A-Za-z.-]+'}
  CertificateArn: {Type: String, Default: ''}
  RootUsername: {Type: String, Default: root, MinLength: 3}
  RootPassword: {Type: String, NoEcho: true, MinLength: 12}
  SessionSecret: {Type: String, NoEcho: true, MinLength: 32}
  DeploymentMode: {Type: String, Default: on-premise, AllowedValues: ['on-premise', 'saas']}
  StripeSecretKey: {Type: String, Default: '', NoEcho: true}
  StripeWebhookSecret: {Type: String, Default: '', NoEcho: true}
  StripeStarterPriceId: {Type: String, Default: ''}
  StripeScalePriceId: {Type: String, Default: ''}
  GuardianModelId: {Type: String, Default: '', AllowedValues: ['', 'amazon.nova-lite-v1:0', 'us.amazon.nova-lite-v1:0']}
  NotificationMode: {Type: String, Default: log, AllowedValues: [log, aws]}
  WhatsappOriginationId: {Type: String, Default: ''}
  NotificationRecipients: {Type: String, Default: ''}
  SesFrom: {Type: String, Default: ''}
  PublicUrl: {Type: String, Default: ''}
  WhatsappEventTopicArn: {Type: String, Default: ''}
  WhatsappAlertTemplate: {Type: String, Default: ''}
Conditions: {UseTLS: {Fn::Not: [{Fn::Equals: [{Ref: CertificateArn}, '']}]}, HasGuardianModel: {Fn::Not: [{Fn::Equals: [{Ref: GuardianModelId}, '']}]}, HasWhatsappTopic: {Fn::Not: [{Fn::Equals: [{Ref: WhatsappEventTopicArn}, '']}]}}
Resources:
  GuardianModelPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGuardianModel
    Properties:
      PolicyName: guardscale-guardian-inference
      Roles: [{Ref: TaskRole}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['bedrock:InvokeModel']
            Resource:
              - {Fn::Sub: 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-lite-v1:0'}
              - {Fn::Sub: 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0'}
  WhatsappQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: HasWhatsappTopic
    Properties:
      Queues: [{Ref: Queue}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: {Fn::GetAtt: [Queue, Arn]}
            Condition: {ArnEquals: {'aws:SourceArn': {Ref: WhatsappEventTopicArn}}}
  WhatsappSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasWhatsappTopic
    Properties:
      TopicArn: {Ref: WhatsappEventTopicArn}
      Protocol: sqs
      Endpoint: {Fn::GetAtt: [Queue, Arn]}
      RawMessageDelivery: false
  Cluster: {Type: 'AWS::ECS::Cluster', Properties: {ClusterName: {Fn::Sub: 'guardscale-${AWS::StackName}'}, ClusterSettings: [{Name: containerInsights, Value: enabled}]}}
  ALBSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties: {GroupDescription: GuardScale public ingress, VpcId: {Ref: VpcId}, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}, {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}]}
  ServiceSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties: {GroupDescription: GuardScale services from ALB, VpcId: {Ref: VpcId}, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 3000, ToPort: 3001, SourceSecurityGroupId: {Ref: ALBSG}}]}
  ALB: {Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer', Properties: {Subnets: {Ref: PublicSubnets}, SecurityGroups: [{Ref: ALBSG}]}}
  WebTarget: {Type: 'AWS::ElasticLoadBalancingV2::TargetGroup', Properties: {VpcId: {Ref: VpcId}, Port: 3000, Protocol: HTTP, TargetType: ip, HealthCheckPath: /api/health}}
  ApiTarget: {Type: 'AWS::ElasticLoadBalancingV2::TargetGroup', Properties: {VpcId: {Ref: VpcId}, Port: 3001, Protocol: HTTP, TargetType: ip, HealthCheckPath: /api/health}}
  Listener: {Type: 'AWS::ElasticLoadBalancingV2::Listener', Properties: {LoadBalancerArn: {Ref: ALB}, Port: 80, Protocol: HTTP, DefaultActions: [{Fn::If: [UseTLS, {Type: redirect, RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}}, {Type: forward, TargetGroupArn: {Ref: WebTarget}}]}]}}
  ApiRule: {Type: 'AWS::ElasticLoadBalancingV2::ListenerRule', Properties: {ListenerArn: {Ref: Listener}, Priority: 10, Conditions: [{Field: path-pattern, Values: ['/api/*']}], Actions: [{Fn::If: [UseTLS, {Type: redirect, RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}}, {Type: forward, TargetGroupArn: {Ref: ApiTarget}}]}]}}
  HttpsListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Condition: UseTLS
    Properties: {LoadBalancerArn: {Ref: ALB}, Port: 443, Protocol: HTTPS, Certificates: [{CertificateArn: {Ref: CertificateArn}}], DefaultActions: [{Type: forward, TargetGroupArn: {Ref: WebTarget}}]}
  HttpsApiRule:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Condition: UseTLS
    Properties: {ListenerArn: {Ref: HttpsListener}, Priority: 10, Conditions: [{Field: path-pattern, Values: ['/api/*']}], Actions: [{Type: forward, TargetGroupArn: {Ref: ApiTarget}}]}
  Queue: {Type: 'AWS::SQS::Queue', Properties: {VisibilityTimeout: 120, MessageRetentionPeriod: 345600, RedrivePolicy: {deadLetterTargetArn: {Fn::GetAtt: [DeadLetterQueue, Arn]}, maxReceiveCount: 5}}}
  DeadLetterQueue: {Type: 'AWS::SQS::Queue', Properties: {MessageRetentionPeriod: 1209600}}
  GuardScaleTable: {Type: 'AWS::DynamoDB::Table', Properties: {BillingMode: PAY_PER_REQUEST, AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}, {AttributeName: gsi1pk, AttributeType: S}, {AttributeName: gsi1sk, AttributeType: S}], KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}], GlobalSecondaryIndexes: [{IndexName: GSI1, KeySchema: [{AttributeName: gsi1pk, KeyType: HASH}, {AttributeName: gsi1sk, KeyType: RANGE}], Projection: {ProjectionType: ALL}}], TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}, PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}, SSESpecification: {SSEEnabled: true}}}
  EvidenceBucket: {Type: 'AWS::S3::Bucket', Properties: {BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}, PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}}}
  LogGroup: {Type: 'AWS::Logs::LogGroup', Properties: {RetentionInDays: 30}}
  ExecutionRole: {Type: 'AWS::IAM::Role', Properties: {AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}, ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']}}
  TaskRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies: [{PolicyName: guardscale-data, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: ['dynamodb:GetItem','dynamodb:PutItem','dynamodb:DeleteItem','dynamodb:Query','dynamodb:UpdateItem'], Resource: [{Fn::GetAtt: [GuardScaleTable, Arn]}, {Fn::Sub: '${GuardScaleTable.Arn}/index/*'}]}, {Effect: Allow, Action: ['sqs:SendMessage','sqs:ReceiveMessage','sqs:DeleteMessage','sqs:GetQueueAttributes'], Resource: {Fn::GetAtt: [Queue, Arn]}}, {Effect: Allow, Action: ['s3:GetObject','s3:PutObject'], Resource: {Fn::Sub: '${EvidenceBucket.Arn}/*'}}, {Effect: Allow, Action: ['ses:SendEmail','social-messaging:SendWhatsAppMessage'], Resource: '*'}]}}]
  WebTask: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: {Fn::GetAtt: [ExecutionRole, Arn]}, TaskRoleArn: {Fn::GetAtt: [TaskRole, Arn]}, ContainerDefinitions: [{Name: web, Image: {Fn::Sub: '${ImageBase}-web:${ReleaseVersion}'}, PortMappings: [{ContainerPort: 3000}], Environment: [{Name: GUARDSCALE_WHATSAPP_ALERT_TEMPLATE, Value: {Ref: WhatsappAlertTemplate}}, {Name: AWS_REGION, Value: {Ref: 'AWS::Region'}}, {Name: GUARDSCALE_AI_MODEL_ID, Value: {Ref: GuardianModelId}}, {Name: GUARDSCALE_NOTIFICATION_MODE, Value: {Ref: NotificationMode}}, {Name: GUARDSCALE_SES_FROM, Value: {Ref: SesFrom}}, {Name: GUARDSCALE_NOTIFICATION_RECIPIENTS, Value: {Ref: NotificationRecipients}}, {Name: GUARDSCALE_WHATSAPP_ORIGINATION_ID, Value: {Ref: WhatsappOriginationId}}, {Name: GUARDSCALE_PUBLIC_URL, Value: {Ref: PublicUrl}}, {Name: GUARDSCALE_WHATSAPP_SNS_TOPIC_ARN, Value: {Ref: WhatsappEventTopicArn}}, {Name: GUARDSCALE_TABLE, Value: {Ref: GuardScaleTable}}, {Name: GUARDSCALE_ROOT_USER, Value: {Ref: RootUsername}}, {Name: GUARDSCALE_ROOT_PASSWORD, Value: {Ref: RootPassword}}, {Name: GUARDSCALE_SESSION_SECRET, Value: {Ref: SessionSecret}}, {Name: GUARDSCALE_DEPLOYMENT_MODE, Value: {Ref: DeploymentMode}}, {Name: STRIPE_SECRET_KEY, Value: {Ref: StripeSecretKey}}, {Name: STRIPE_WEBHOOK_SECRET, Value: {Ref: StripeWebhookSecret}}, {Name: STRIPE_STARTER_PRICE_ID, Value: {Ref: StripeStarterPriceId}}, {Name: STRIPE_SCALE_PRICE_ID, Value: {Ref: StripeScalePriceId}}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: {Ref: LogGroup}, awslogs-region: {Ref: 'AWS::Region'}, awslogs-stream-prefix: web}}}]}}
  ApiTask: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: {Fn::GetAtt: [ExecutionRole, Arn]}, TaskRoleArn: {Fn::GetAtt: [TaskRole, Arn]}, ContainerDefinitions: [{Name: api, Image: {Fn::Sub: '${ImageBase}-api:${ReleaseVersion}'}, PortMappings: [{ContainerPort: 3001}], Environment: [{Name: GUARDSCALE_DEPLOYMENT_MODE, Value: {Ref: DeploymentMode}}, {Name: GUARDSCALE_WHATSAPP_ALERT_TEMPLATE, Value: {Ref: WhatsappAlertTemplate}}, {Name: AWS_REGION, Value: {Ref: 'AWS::Region'}}, {Name: GUARDSCALE_AI_MODEL_ID, Value: {Ref: GuardianModelId}}, {Name: GUARDSCALE_NOTIFICATION_MODE, Value: {Ref: NotificationMode}}, {Name: GUARDSCALE_SES_FROM, Value: {Ref: SesFrom}}, {Name: GUARDSCALE_NOTIFICATION_RECIPIENTS, Value: {Ref: NotificationRecipients}}, {Name: GUARDSCALE_WHATSAPP_ORIGINATION_ID, Value: {Ref: WhatsappOriginationId}}, {Name: GUARDSCALE_PUBLIC_URL, Value: {Ref: PublicUrl}}, {Name: GUARDSCALE_WHATSAPP_SNS_TOPIC_ARN, Value: {Ref: WhatsappEventTopicArn}}, {Name: GUARDSCALE_TABLE, Value: {Ref: GuardScaleTable}}, {Name: GUARDSCALE_QUEUE_URL, Value: {Ref: Queue}}, {Name: GUARDSCALE_EVIDENCE_BUCKET, Value: {Ref: EvidenceBucket}}, {Name: GUARDSCALE_ROOT_USER, Value: {Ref: RootUsername}}, {Name: GUARDSCALE_ROOT_PASSWORD, Value: {Ref: RootPassword}}, {Name: GUARDSCALE_SESSION_SECRET, Value: {Ref: SessionSecret}}, {Name: STRIPE_SECRET_KEY, Value: {Ref: StripeSecretKey}}, {Name: STRIPE_WEBHOOK_SECRET, Value: {Ref: StripeWebhookSecret}}, {Name: STRIPE_STARTER_PRICE_ID, Value: {Ref: StripeStarterPriceId}}, {Name: STRIPE_SCALE_PRICE_ID, Value: {Ref: StripeScalePriceId}}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: {Ref: LogGroup}, awslogs-region: {Ref: 'AWS::Region'}, awslogs-stream-prefix: api}}}]}}
  WorkerTask: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: {Fn::GetAtt: [ExecutionRole, Arn]}, TaskRoleArn: {Fn::GetAtt: [TaskRole, Arn]}, ContainerDefinitions: [{Name: worker, Image: {Fn::Sub: '${ImageBase}-worker:${ReleaseVersion}'}, Environment: [{Name: GUARDSCALE_WHATSAPP_ALERT_TEMPLATE, Value: {Ref: WhatsappAlertTemplate}}, {Name: AWS_REGION, Value: {Ref: 'AWS::Region'}}, {Name: GUARDSCALE_AI_MODEL_ID, Value: {Ref: GuardianModelId}}, {Name: GUARDSCALE_NOTIFICATION_MODE, Value: {Ref: NotificationMode}}, {Name: GUARDSCALE_SES_FROM, Value: {Ref: SesFrom}}, {Name: GUARDSCALE_NOTIFICATION_RECIPIENTS, Value: {Ref: NotificationRecipients}}, {Name: GUARDSCALE_WHATSAPP_ORIGINATION_ID, Value: {Ref: WhatsappOriginationId}}, {Name: GUARDSCALE_PUBLIC_URL, Value: {Ref: PublicUrl}}, {Name: GUARDSCALE_WHATSAPP_SNS_TOPIC_ARN, Value: {Ref: WhatsappEventTopicArn}}, {Name: GUARDSCALE_QUEUE_URL, Value: {Ref: Queue}}, {Name: GUARDSCALE_TABLE, Value: {Ref: GuardScaleTable}}, {Name: GUARDSCALE_SESSION_SECRET, Value: {Ref: SessionSecret}}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: {Ref: LogGroup}, awslogs-region: {Ref: 'AWS::Region'}, awslogs-stream-prefix: worker}}}]}}
  WebService: {Type: 'AWS::ECS::Service', DependsOn: Listener, Properties: {Cluster: {Ref: Cluster}, LaunchType: FARGATE, DesiredCount: 1, TaskDefinition: {Ref: WebTask}, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, Subnets: {Ref: PrivateSubnets}, SecurityGroups: [{Ref: ServiceSG}]}}, LoadBalancers: [{ContainerName: web, ContainerPort: 3000, TargetGroupArn: {Ref: WebTarget}}]}}
  ApiService: {Type: 'AWS::ECS::Service', DependsOn: ApiRule, Properties: {Cluster: {Ref: Cluster}, LaunchType: FARGATE, DesiredCount: 1, TaskDefinition: {Ref: ApiTask}, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, Subnets: {Ref: PrivateSubnets}, SecurityGroups: [{Ref: ServiceSG}]}}, LoadBalancers: [{ContainerName: api, ContainerPort: 3001, TargetGroupArn: {Ref: ApiTarget}}]}}
  WorkerService: {Type: 'AWS::ECS::Service', Properties: {Cluster: {Ref: Cluster}, LaunchType: FARGATE, DesiredCount: 1, TaskDefinition: {Ref: WorkerTask}, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, Subnets: {Ref: PrivateSubnets}, SecurityGroups: [{Ref: ServiceSG}]}}}}
Outputs:
  URL: {Value: {Fn::If: [UseTLS, {Fn::Sub: 'https://${ALB.DNSName}'}, {Fn::Sub: 'http://${ALB.DNSName}'}]}}
  RootUsername: {Value: {Ref: RootUsername}}
