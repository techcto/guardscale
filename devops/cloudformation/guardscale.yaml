iceId"}},{"Name":"STRIPE_LOG_OVERAGE_PRICE_ID","Value":{"Ref":"StripeLogOveragePriceId"}},{"Name":"STRIPE_AI_OVERAGE_PRICE_ID","Value":{"Ref":"StripeAIOveragePriceId"}},{"Name":"GUARDSCALE_LOG_MB_INCLUDED_JSON","Value":{"Ref":"LogMbIncluded"}},{"Name":"GUARDSCALE_AI_CREDIT_WEIGHTS_JSON","Value":{"Ref":"AICreditWeights"}},{"Name":"GUARDSCALE_WHATSAPP_TEMPLATE_LANGUAGE","Value":{"Ref":"WhatsappTemplateLanguage"}}],"LogConfiguration":{"LogDriver":"awslogs","Options":{"awslogs-group":{"Ref":"LogGroup"},"awslogs-region":{"Ref":"AWS::Region"},"awslogs-stream-prefix":"api"}}}]}}
