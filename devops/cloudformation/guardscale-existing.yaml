AWSTemplateFormatVersion: '2010-09-09'
Description: GuardScale control plane, attached to an existing ECS cluster and ALB (host-header routed).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network prerequisites
        Parameters:
          - VpcId
          - ServiceSubnets
          - HostHeader
      - Label:
          default: Existing ECS and ALB resources
        Parameters:
          - Cluster
          - LoadBalancerSecurityGroup
          - ListenerArn
          - ApiListenerPriority
          - WebListenerPriority
      - Label:
          default: GuardScale settings
        Parameters:
          - EnvironmentName
          - RootUsername
          - RootPassword
          - SessionSecret
          - DeploymentMode
          - WhatsappOriginationId
          - NotificationRecipients
          - SesFrom
          - StripeSecretKey
          - StripeWebhookSecret
          - StripeCredentialsSecretArn
          - StripeCredentialsKmsKeyArn
          - StripeCredentialsRevision
          - StripeMode
          - StripeStarterPriceId
          - StripeScalePriceId
          - UsageExport
          - StripeServerOveragePriceId
          - StripeLogOveragePriceId
          - StripeAIOveragePriceId
          - LogMbIncluded
          - AICreditWeights
      - Label:
          default: Published images
        Parameters:
          - WebImage
          - ApiImage
          - WorkerImage
          - DesiredCount
          - AssignPublicIp

Parameters:
  BlockedSignupDomains: {"Type":"String","Default":"","Description":"Optional comma-separated signup domain blocklist. Domain and subdomains are blocked for public registration; empty permits all valid email domains."}
  GuardianModelId:
    Type: String
    Default: ''
    AllowedValues: ['', 'amazon.nova-lite-v1:0', 'us.amazon.nova-lite-v1:0']
  NotificationMode:
    Type: String
    Default: log
    AllowedValues: [log, aws]
  WhatsappEventTopicArn:
    Type: String
    Default: ''
  WhatsappAlertTemplate:
    Type: String
    Default: ''
  EnvironmentName:
    Type: String
    Default: guardscale
    Description: Prefix used for GuardScale task, service, log, and target group names.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing application VPC.
  Cluster:
    Type: String
    Description: Existing ECS cluster name or ARN.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the existing public ALB.
  ListenerArn:
    Type: String
    Description: Existing HTTP or HTTPS listener ARN.
  ServiceSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing private ECS service subnets with NAT access for image pulls.
  HostHeader:
    Type: String
    Description: Dedicated hostname for GuardScale, for example guardscale.org.
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]'
  ApiListenerPriority:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 49999
    Description: Unused priority on the shared listener for the host+/api/* rule. Must sort before WebListenerPriority so /api/* is matched before the catch-all web rule.
  WebListenerPriority:
    Type: Number
    Default: 101
    MinValue: 1
    MaxValue: 49999
    Description: Unused priority on the shared listener for the host-only catch-all rule.
  RootUsername:
    Type: String
    Default: root
    MinLength: 3
  RootPassword:
    Type: String
    NoEcho: true
    MinLength: 12
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  DeploymentMode:
    Type: String
    Default: on-premise
    AllowedValues: ['on-premise', 'saas']
  WhatsappOriginationId:
    Type: String
    Default: ''
  NotificationRecipients:
    Type: String
    Default: ''
  SesFrom:
    Type: String
    Default: ''
  StripeSecretKey: {"Type":"String","NoEcho":true,"Default":"","AllowedPattern":"^$|^(sk|rk)_(live|test)_[a-zA-Z0-9]+$","Description":"Optional initial Stripe secret key. Stored in a retained Secrets Manager secret, never a task definition environment value. Prefer an existing secret ARN for enterprise installs."}
  StripeWebhookSecret: {"Type":"String","NoEcho":true,"Default":"","AllowedPattern":"^$|^whsec_[a-zA-Z0-9]+$","Description":"Stripe webhook signing secret paired with StripeSecretKey. Stored in Secrets Manager."}
  StripeStarterPriceId:
    Type: String
    Default: ''
  StripeScalePriceId:
    Type: String
    Default: ''
  UsageExport:
    Type: String
    Default: disabled
    AllowedValues: [disabled, enabled]
    Description: Enable opted-in overage and Stripe meter export (saas only). Disabled keeps hard plan limits.
  StripeServerOveragePriceId:
    Type: String
    Default: ''
    Description: Metered price on guardscale_server_hours_v1 (setup-plans.mjs).
  StripeLogOveragePriceId:
    Type: String
    Default: ''
    Description: Metered price on guardscale_log_mb_v1.
  StripeAIOveragePriceId:
    Type: String
    Default: ''
    Description: Metered price on guardscale_ai_credits_v1.
  LogMbIncluded:
    Type: String
    Default: ''
    Description: JSON of log MB included per plan. Empty leaves logs unmetered.
  AICreditWeights:
    Type: String
    Default: ''
    Description: Versioned AI credit weights JSON with included_credits per plan. Empty leaves AI unpriced.
  WebImage:
    Type: String
    Description: Published ECR image URI for the GuardScale web container.
  ApiImage:
    Type: String
    Description: Published ECR image URI for the GuardScale api container.
  WorkerImage:
    Type: String
    Description: Published ECR image URI for the GuardScale worker container.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]

  WhatsappBusinessAccountId: {"Type":"String","Default":"","AllowedPattern":"^$|^waba-[a-zA-Z0-9]+$","Description":"Registered WABA ID. With no existing topic ARN, creates and connects a stack-owned SNS topic. Never replaces a different WABA destination."}
  WhatsappTemplateLanguage: {"Type":"String","Default":"en_US","AllowedPattern":"[a-z]{2,3}(_[A-Z]{2})?","Description":"Language of the approved WhatsApp alert template."}
  StripeCredentialsSecretArn: {"Type":"String","Default":"","AllowedPattern":"^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+$","Description":"Optional existing same-account, same-region Stripe JSON secret ARN. Keys: secret_key and webhook_secret. Leave raw Stripe parameters empty when supplied."}
  StripeCredentialsKmsKeyArn: {"Type":"String","Default":"","AllowedPattern":"^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$","Description":"Optional customer-managed KMS key ARN for the Stripe secret. Key policy must permit the task execution role to decrypt."}
  StripeCredentialsRevision: {"Type":"String","Default":"1","AllowedPattern":"[a-zA-Z0-9.-]+","Description":"Increment after rotating Stripe credentials to roll tasks through a reviewed CloudFormation change set."}
  StripeMode: {"Type":"String","Default":"live","AllowedValues":["live","sandbox"],"Description":"Stripe environment. Use live keys in production and sandbox keys only in isolated test deployments."}
Conditions:
  HasGuardianModel: !Not [!Equals [!Ref GuardianModelId, '']]
  HasWhatsappTopic: {"Fn::Or":[{"Condition":"HasExistingWhatsappTopic"},{"Condition":"CreateWhatsappTopic"}]}
  HasExistingWhatsappTopic: {"Fn::Not":[{"Fn::Equals":[{"Ref":"WhatsappEventTopicArn"},""]}]}
  CreateWhatsappTopic: {"Fn::And":[{"Fn::Not":[{"Fn::Equals":[{"Ref":"WhatsappBusinessAccountId"},""]}]},{"Fn::Equals":[{"Ref":"WhatsappEventTopicArn"},""]}]}
  UseExternalStripeSecret: {"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeCredentialsSecretArn"},""]}]}
  CreateStripeSecret: {"Fn::And":[{"Fn::Equals":[{"Ref":"StripeCredentialsSecretArn"},""]},{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeSecretKey"},""]}]}]}
  UseStripeCredentials: {"Fn::Or":[{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeCredentialsSecretArn"},""]}]},{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeSecretKey"},""]}]}]}
  UseStripeKmsKey: {"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeCredentialsKmsKeyArn"},""]}]}
  UseStripeKmsAccess: {"Fn::And":[{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeCredentialsKmsKeyArn"},""]}]},{"Fn::Or":[{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeCredentialsSecretArn"},""]}]},{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeSecretKey"},""]}]}]}]}
Rules:
  StripeCredentialSource: {"Assertions":[{"Assert":{"Fn::Or":[{"Fn::And":[{"Fn::Equals":[{"Ref":"StripeSecretKey"},""]},{"Fn::Equals":[{"Ref":"StripeWebhookSecret"},""]}]},{"Fn::And":[{"Fn::Equals":[{"Ref":"StripeCredentialsSecretArn"},""]},{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeSecretKey"},""]}]},{"Fn::Not":[{"Fn::Equals":[{"Ref":"StripeWebhookSecret"},""]}]}]}]},"AssertDescription":"Supply both raw Stripe credentials or an existing secret ARN, never partial credentials or both sources."}]}
Resources:
  GuardianModelPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGuardianModel
    Properties:
      PolicyName: guardscale-guardian-inference
      Roles: [{Ref: TaskRole}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['bedrock:InvokeModel']
            Resource:
              - {Fn::Sub: 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-lite-v1:0'}
              - {Fn::Sub: 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0'}
  WhatsappQueuePolicy: {"Type":"AWS::SQS::QueuePolicy","Condition":"HasWhatsappTopic","Properties":{"Queues":[{"Ref":"Queue"}],"PolicyDocument":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"sns.amazonaws.com"},"Action":"sqs:SendMessage","Resource":{"Fn::GetAtt":["Queue","Arn"]},"Condition":{"ArnEquals":{"aws:SourceArn":{"Fn::If":["CreateWhatsappTopic",{"Ref":"WhatsappTopic"},{"Ref":"WhatsappEventTopicArn"}]}}}}]}}}
  WhatsappSubscription: {"Type":"AWS::SNS::Subscription","Condition":"HasWhatsappTopic","Properties":{"TopicArn":{"Fn::If":["CreateWhatsappTopic",{"Ref":"WhatsappTopic"},{"Ref":"WhatsappEventTopicArn"}]},"Protocol":"sqs","Endpoint":{"Fn::GetAtt":["Queue","Arn"]},"RawMessageDelivery":false},"DependsOn":["WhatsappQueuePolicy"]}
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GuardScale ECS task traffic from the existing ALB.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-services'

  WebIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  ApiIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 3001
      ToPort: 3001
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  Queue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  GuardScaleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ExecutionRole: {"Type":"AWS::IAM::Role","Properties":{"AssumeRolePolicyDocument":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]},"ManagedPolicyArns":["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"],"Policies":[{"Fn::If":["UseStripeCredentials",{"PolicyName":"stripe-credentials-read","PolicyDocument":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"secretsmanager:GetSecretValue","Resource":{"Fn::If":["UseExternalStripeSecret",{"Ref":"StripeCredentialsSecretArn"},{"Ref":"StripeCredentials"}]}}]}},{"Ref":"AWS::NoValue"}]},{"Fn::If":["UseStripeKmsAccess",{"PolicyName":"stripe-key-decrypt","PolicyDocument":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"kms:Decrypt","Resource":{"Ref":"StripeCredentialsKmsKeyArn"},"Condition":{"StringEquals":{"kms:ViaService":{"Fn::Sub":"secretsmanager.${AWS::Region}.${AWS::URLSuffix}"},"kms:EncryptionContext:SecretARN":{"Fn::If":["UseExternalStripeSecret",{"Ref":"StripeCredentialsSecretArn"},{"Ref":"StripeCredentials"}]}}}}]}},{"Ref":"AWS::NoValue"}]}]}}
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: guardscale-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt GuardScaleTable.Arn
                  - !Sub '${GuardScaleTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt Queue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${EvidenceBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - social-messaging:SendWhatsAppMessage
                  - social-messaging:ListLinkedWhatsAppBusinessAccounts
                  - social-messaging:GetLinkedWhatsAppBusinessAccount
                  - social-messaging:GetLinkedWhatsAppBusinessAccountPhoneNumber
                  - social-messaging:ListWhatsAppMessageTemplates
                Resource: '*'

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/web'
      RetentionInDays: 30

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/api'
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/worker'
      RetentionInDays: 30

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-web'
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-api'
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health

  WebTaskDefinition: {"Type":"AWS::ECS::TaskDefinition","Properties":{"Family":{"Fn::Sub":"${EnvironmentName}-web"},"Cpu":"256","Memory":"512","NetworkMode":"awsvpc","RequiresCompatibilities":["FARGATE"],"ExecutionRoleArn":{"Fn::GetAtt":["ExecutionRole","Arn"]},"TaskRoleArn":{"Fn::GetAtt":["TaskRole","Arn"]},"ContainerDefinitions":[{"Name":"web","Image":{"Ref":"WebImage"},"Essential":true,"PortMappings":[{"ContainerPort":3000}],"Environment":[{"Name":"GUARDSCALE_BLOCKED_SIGNUP_DOMAINS","Value":{"Ref":"BlockedSignupDomains"}},{"Name":"NODE_ENV","Value":"production"},{"Name":"PORT","Value":"3000"},{"Name":"GUARDSCALE_DEPLOYMENT_MODE","Value":{"Ref":"DeploymentMode"}},{"Name":"GUARDSCALE_ROOT_USER","Value":{"Ref":"RootUsername"}},{"Name":"GUARDSCALE_ROOT_PASSWORD","Value":{"Ref":"RootPassword"}},{"Name":"GUARDSCALE_SESSION_SECRET","Value":{"Ref":"SessionSecret"}},{"Name":"AWS_REGION","Value":{"Ref":"AWS::Region"}},{"Name":"GUARDSCALE_AI_MODEL_ID","Value":{"Ref":"GuardianModelId"}},{"Name":"GUARDSCALE_NOTIFICATION_MODE","Value":{"Ref":"NotificationMode"}},{"Name":"GUARDSCALE_WHATSAPP_ALERT_TEMPLATE","Value":{"Ref":"WhatsappAlertTemplate"}},{"Name":"GUARDSCALE_PUBLIC_URL","Value":{"Fn::Sub":"https://${HostHeader}"}},{"Name":"GUARDSCALE_WHATSAPP_SNS_TOPIC_ARN","Value":{"Fn::If":["CreateWhatsappTopic",{"Ref":"WhatsappTopic"},{"Ref":"WhatsappEventTopicArn"}]}},{"Name":"GUARDSCALE_TABLE","Value":{"Ref":"GuardScaleTable"}},{"Name":"GUARDSCALE_QUEUE_URL","Value":{"Ref":"Queue"}},{"Name":"GUARDSCALE_EVIDENCE_BUCKET","Value":{"Ref":"EvidenceBucket"}},{"Name":"GUARDSCALE_WHATSAPP_ORIGINATION_ID","Value":{"Ref":"WhatsappOriginationId"}},{"Name":"GUARDSCALE_NOTIFICATION_RECIPIENTS","Value":{"Ref":"NotificationRecipients"}},{"Name":"GUARDSCALE_SES_FROM","Value":{"Ref":"SesFrom"}},{"Name":"STRIPE_STARTER_PRICE_ID","Value":{"Ref":"StripeStarterPriceId"}},{"Name":"STRIPE_SCALE_PRICE_ID","Value":{"Ref":"StripeScalePriceId"}},{"Name":"GUARDSCALE_USAGE_EXPORT","Value":{"Ref":"UsageExport"}},{"Name":"STRIPE_SERVER_OVERAGE_PRICE_ID","Value":{"Ref":"StripeServerOveragePriceId"}},{"Name":"STRIPE_LOG_OVERAGE_PRICE_ID","Value":{"Ref":"StripeLogOveragePriceId"}},{"Name":"STRIPE_AI_OVERAGE_PRICE_ID","Value":{"Ref":"StripeAIOveragePriceId"}},{"Name":"GUARDSCALE_LOG_MB_INCLUDED_JSON","Value":{"Ref":"LogMbIncluded"}},{"Name":"GUARDSCALE_AI_CREDIT_WEIGHTS_JSON","Value":{"Ref":"AICreditWeights"}},{"Name":"GUARDSCALE_WHATSAPP_TEMPLATE_LANGUAGE","Value":{"Ref":"WhatsappTemplateLanguage"}},{"Name":"GUARDSCALE_STRIPE_CREDENTIALS_REVISION","Value":{"Ref":"StripeCredentialsRevision"}},{"Name":"GUARDSCALE_STRIPE_MODE","Value":{"Ref":"StripeMode"}}],"LogConfiguration":{"LogDriver":"awslogs","Options":{"awslogs-group":{"Ref":"WebLogGroup"},"awslogs-region":{"Ref":"AWS::Region"},"awslogs-stream-prefix":"web"}},"Secrets":[{"Fn::If":["UseStripeCredentials",{"Name":"STRIPE_SECRET_KEY","ValueFrom":{"Fn::Join":["",[{"Fn::If":["UseExternalStripeSecret",{"Ref":"StripeCredentialsSecretArn"},{"Ref":"StripeCredentials"}]},":secret_key::"]]}},{"Ref":"AWS::NoValue"}]},{"Fn::If":["UseStripeCredentials",{"Name":"STRIPE_WEBHOOK_SECRET","ValueFrom":{"Fn::Join":["",[{"Fn::If":["UseExternalStripeSecret",{"Ref":"StripeCredentialsSecretArn"},{"Ref":"StripeCredentials"}]},":webhook_secret::"]]}},{"Ref":"AWS::NoValue"}]}]}]}}
