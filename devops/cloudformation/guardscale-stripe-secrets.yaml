AWSTemplateFormatVersion: '2010-09-09'
Description: GuardScale retained Stripe credentials for separate live and sandbox environments.
Parameters:
  SecretPrefix:
    Type: String
    Default: guardscale/stripe
    AllowedPattern: '[a-zA-Z0-9/_-]+'
  KmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key. Empty uses the Secrets Manager managed key.
Conditions:
  UseCustomerKey: !Not [!Equals [!Ref KmsKeyArn, '']]
Resources:
  LiveCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${SecretPrefix}/live'
      Description: GuardScale live Stripe credentials. Populate both fields before enabling billing.
      KmsKeyId: !If [UseCustomerKey, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      SecretString: '{"secret_key":"","webhook_secret":""}'
      Tags:
        - Key: Application
          Value: guardscale
        - Key: BillingEnvironment
          Value: live
  SandboxCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${SecretPrefix}/sandbox'
      Description: GuardScale Stripe sandbox credentials. Never use live keys here.
      KmsKeyId: !If [UseCustomerKey, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      SecretString: '{"secret_key":"","webhook_secret":""}'
      Tags:
        - Key: Application
          Value: guardscale
        - Key: BillingEnvironment
          Value: sandbox
Outputs:
  LiveCredentialsArn:
    Value: !Ref LiveCredentials
  SandboxCredentialsArn:
    Value: !Ref SandboxCredentials
