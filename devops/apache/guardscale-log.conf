# Extended combined format used by CMS v11.12.38; use the existing access log.
# In each monitored VirtualHost: CustomLog /var/log/httpd/access_log guardscale
# Configure explicit proxy.trusted_cidrs in GuardScale; headers alone are untrusted.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" \"%{c}a\" \"%{Host}i\" %{ms}T" guardscale
