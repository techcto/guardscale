<VirtualHost *:80>
  ServerName local-fixture.test
  DocumentRoot /var/www/html
  <Directory /var/www/html>
    Options -Indexes
    FallbackResource /index.php
  </Directory>
  CustomLog /var/log/guardscale/access.log combined
  ErrorLog /var/log/guardscale/apache-error.log
  LogLevel warn
  <Location /forbidden>
    Require all denied
  </Location>
</VirtualHost>
